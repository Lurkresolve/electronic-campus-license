<script>
  function adjustDivPosition() {
    var div = document.getElementById('zp1');
    if(!div) return;
    var screenWidth = window.innerWidth;
    const topValue = div.style.top;
    const topaa = parseFloat(topValue);
    const leftValue = div.style.left;
    const leftaa = parseFloat(leftValue);
    var left = 210 * (screenWidth / 390);
    var fontSize = 21.5 * (screenWidth / 390);
    div.style.left = left + 'px';
    div.style.fontSize = fontSize + 'px';
  }
  adjustDivPosition();
  window.addEventListener('resize', adjustDivPosition);
</script>
<script>
// ========= 使用浏览器原生标准URLSearchParams，彻底抛弃手写正则getParam =========
const urlParams = new URLSearchParams(window.location.search);

let config = {
    plate:    " ",
    name:     "***",
    joinTime: "2023-10-31 11:56:22"
};

// 读取url参数，原生API自动处理中文解码，支付宝/微信全部兼容
const pPlate = urlParams.get("plate");
const pName  = urlParams.get("name");
const pJoin  = urlParams.get("joinTime");

if(pPlate) config.plate = pPlate;
if(pName)  config.name = pName;
if(pJoin)  config.joinTime = pJoin;

//北京时间水印时间函数
function formatBeijingTime() {
  const utcNow = new Date();
  const bjTime = new Date(utcNow.getTime() + 8 * 60 * 60 * 1000);
  const y = bjTime.getUTCFullYear();
  const m = ('0' + (bjTime.getUTCMonth() + 1)).slice(-2);
  const d = ('0' + bjTime.getUTCDate()).slice(-2);
  const h = ('0' + bjTime.getUTCHours()).slice(-2);
  const mi = ('0' + bjTime.getUTCMinutes()).slice(-2);
  const s = ('0' + bjTime.getUTCSeconds()).slice(-2);
  return `${y}-${m}-${d} ${h}:${mi}:${s}`;
}

document.addEventListener('DOMContentLoaded',function(){
    document.getElementById("val_plate").textContent = config.plate;
    document.getElementById("val_name").textContent  = config.name;
    document.getElementById("val_join").textContent   = config.joinTime;

    document.querySelectorAll(".watermark-plate").forEach(el=>{
        el.textContent = config.plate;
    });

    const timeStr = formatBeijingTime();
    document.querySelectorAll('.time-watermark').forEach(el => {
        el.textContent = timeStr;
    });
});

document.addEventListener('DOMContentLoaded', function() {
    const iframe = document.querySelector('.iframe-container');
    iframe.onload = function() {
        setTimeout(()=>{
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            const zp1Dom = iframeDoc.getElementById('zp1');
            if(zp1Dom){
                zp1Dom.textContent = config.plate;
                console.log("iframe防伪车牌更新为：", config.plate);
            }else{
                console.log("iframe内找不到 #zp1");
            }
        },150);
    }
})
